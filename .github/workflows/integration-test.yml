name: Integration Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: integration-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    name: End-to-end drift classification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.9"
          terraform_wrapper: false

      - name: Build terrawatch
        run: go build -o terrawatch .

      - name: Terraform init + apply baseline
        working-directory: testdata/workspace
        run: |
          terraform init
          terraform apply -auto-approve -var="instance_count=1"

      - name: Write strict-mode test config
        run: |
          cat > terrawatch-test.yaml <<'EOF'
          drift_mode: strict
          stacks:
            - name: test-stack
              path: ./testdata/workspace
              vars_file: terraform.tfvars
          github:
            token: test-token-not-used-in-dry-run
            repo: example/example
            base_branch: main
          EOF

      - name: Introduce genuine out-of-band drift
        working-directory: testdata/workspace
        run: printf 'changed outside terraform\n' > managed.txt

      - name: Verify real infrastructure drift classification
        run: |
          set +e
          OUTPUT=$(./terrawatch detect --config terrawatch-test.yaml --dry-run 2>&1)
          CODE=$?
          set -e
          echo "$OUTPUT"
          test "$CODE" -eq 2
          echo "$OUTPUT" | grep -q "infra drift"

      - name: Reconcile external drift
        working-directory: testdata/workspace
        run: terraform apply -auto-approve -var="instance_count=1"

      - name: Introduce unapplied code change
        working-directory: testdata/workspace
        run: echo 'instance_count = 2' > terraform.tfvars

      - name: Verify unapplied changes are informational in strict mode
        run: |
          set +e
          OUTPUT=$(./terrawatch detect --config terrawatch-test.yaml --dry-run 2>&1)
          CODE=$?
          set -e
          echo "$OUTPUT"
          test "$CODE" -eq 0
          echo "$OUTPUT" | grep -q "unapplied changes"
