# Example only — copy this file into your infrastructure repository as
# .github/workflows/terraform-drift.yml and customize authentication/config.
#
# TerraWatch intentionally does not run this workflow against its own source
# repository: drift detection belongs next to the Terraform state and cloud
# credentials it monitors.
name: Terraform Drift Detection

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (no PR created)"
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

jobs:
  detect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.9"
          terraform_wrapper: false

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install TerraWatch
        run: go install github.com/MaripeddiSupraj/terrawatch@latest

      # Add your cloud authentication here. Prefer workload identity/OIDC over
      # long-lived access keys.

      - name: Detect drift
        env:
          GITHUB_TOKEN: ${{ secrets.TERRAWATCH_PAT }}
        run: |
          FLAGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            FLAGS="--dry-run"
          fi
          terrawatch detect --config terrawatch.yaml $FLAGS
