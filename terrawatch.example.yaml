# How to treat plan changes:
#   all    - any change is drift (default)
#   strict - run a refresh-only plan first; only real infrastructure drift
#            opens a PR / fails the run. Merged-but-unapplied code changes
#            are reported for visibility but do not fail. (Same as --classify.)
# drift_mode: all

# Close a stack's open drift PR automatically when it comes back clean.
# auto_close: true

# How many stacks to plan concurrently (default: 1, i.e. sequential).
# The --parallel flag overrides this.
# concurrency: 4

# Ignore rules reduce noise by filtering out known false-drift.
# Each rule has a glob pattern on the resource address and an optional
# list of attribute dot-paths. With no attributes, the entire resource
# is ignored. With attributes, those specific diffs are suppressed.
# ignore:
#   - resource: "aws_autoscaling_group.*"
#     attributes: [desired_capacity]
#   - resource: "*"
#     attributes: [tags.LastScanned, tags_all]
#   - resource: "null_resource.ephemeral_*"

# Per-stack ignore rules are merged with (appended to) global rules.
stacks:
  - name: production
    path: ./environments/prod
    vars_file: prod.tfvars        # optional
  - name: staging
    path: ./environments/staging
    # backend_config:             # optional — passed to init as
    #   key: staging/tf.tfstate   # -backend-config=key=value flags
    # ignore:
    #   - resource: "aws_instance.canary"
    #     attributes: [user_data, ami]

# Use either github OR gitlab — not both

# GitHub
github:
  token: ${GITHUB_TOKEN}          # or set GITHUB_TOKEN env var
  repo: your-org/your-infra-repo
  base_branch: main
  labels:
    - drift
    - infra
  assignees: []

# GitLab (comment out github block and uncomment this)
# gitlab:
#   token: ${GITLAB_TOKEN}        # or set GITLAB_TOKEN env var
#   repo: your-group/your-project
#   url: https://gitlab.com       # optional — for self-hosted GitLab
#   base_branch: main
#   labels:
#     - drift
#   assignees: []

terraform:
  bin_path: terraform             # optional — auto-detects terraform, then tofu (OpenTofu)
  timeout: 30m                    # optional — per-command timeout; "0" disables (default 30m)
