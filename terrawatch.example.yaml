# Ignore rules reduce noise by filtering out known false-drift.
# Each rule has a glob pattern on the resource address and an optional
# list of attribute dot-paths. With no attributes, the entire resource
# is ignored. With attributes, those specific diffs are suppressed.
# ignore:
#   - resource: "aws_autoscaling_group.*"
#     attributes: [desired_capacity]
#   - resource: "*"
#     attributes: [tags.LastScanned, tags_all]
#   - resource: "null_resource.ephemeral_*"

# Per-stack ignore rules are merged with (appended to) global rules.
stacks:
  - name: production
    path: ./environments/prod
    vars_file: prod.tfvars        # optional
  - name: staging
    path: ./environments/staging
    # ignore:
    #   - resource: "aws_instance.canary"
    #     attributes: [user_data, ami]

# Use either github OR gitlab — not both

# GitHub
github:
  token: ${GITHUB_TOKEN}          # or set GITHUB_TOKEN env var
  repo: your-org/your-infra-repo
  base_branch: main
  labels:
    - drift
    - infra
  assignees: []

# GitLab (comment out github block and uncomment this)
# gitlab:
#   token: ${GITLAB_TOKEN}        # or set GITLAB_TOKEN env var
#   repo: your-group/your-project
#   url: https://gitlab.com       # optional — for self-hosted GitLab
#   base_branch: main
#   labels:
#     - drift
#   assignees: []

terraform:
  bin_path: terraform             # optional, defaults to "terraform" on PATH
