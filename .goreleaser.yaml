version: 2

project_name: terrawatch

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - id: terrawatch
    main: ./main.go
    binary: terrawatch
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}

archives:
  - id: terrawatch
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - terrawatch.example.yaml

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - Merge pull request
      - Merge branch

release:
  github:
    owner: MaripeddiSupraj
    name: terrawatch
  name_template: "v{{ .Version }}"
  draft: false
  prerelease: auto

# goreleaser v2.10+ replaced `brews` (formulas) with `homebrew_casks`
homebrew_casks:
  - name: terrawatch
    repository:
      owner: MaripeddiSupraj
      name: homebrew-terrawatch
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Casks
    homepage: https://github.com/MaripeddiSupraj/terrawatch
    description: Detect Terraform infrastructure drift and automatically open a pull request
    license: MIT
    caveats: |
      ╔══════════════════════════════════════════════════════╗
      ║          terrawatch installed successfully!          ║
      ║                                                      ║
      ║  Detect Terraform drift. Open a PR automatically.   ║
      ╚══════════════════════════════════════════════════════╝

      Get started:

        1. Grab the example config:
             curl -O https://raw.githubusercontent.com/MaripeddiSupraj/terrawatch/main/terrawatch.example.yaml
             mv terrawatch.example.yaml terrawatch.yaml

        2. Edit terrawatch.yaml with your stacks and GitHub repo

        3. Run drift detection:
             terrawatch detect --config terrawatch.yaml

      Docs: https://github.com/MaripeddiSupraj/terrawatch
    # unsigned binary — strip the quarantine attribute so macOS will run it
    hooks:
      post:
        install: |
          if system_command("/usr/bin/xattr", args: ["-h"]).exit_status == 0
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/terrawatch"]
          end
